# VIPs for LoadBalancer services. Outside node IPs (.10, .20-.22) and DHCP (.200-.254)
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: main-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.10.100.100-10.10.100.150
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-pool
  namespace: metallb-system
spec:
  ipAddressPools:
    - main-pool
