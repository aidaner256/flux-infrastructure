---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/headlamp/app
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp-config
  namespace: flux-system
spec:
  dependsOn:
    - name: headlamp
  interval: 10m
  path: ./infrastructure/headlamp/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
